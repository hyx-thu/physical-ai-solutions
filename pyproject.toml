[project]
name = "physicalai-enterprise-agents"
version = "0.1.0"
description = "Google Agent Development Kit (ADK) enterprise agents for Gemini Enterprise across Physical AI and Robotics domains."
requires-python = ">=3.10, <3.14"
license = "Apache-2.0"
dependencies = [
    "google-adk>=2.5.0",
    "google-cloud-bigquery>=3.0.0",
    "google-cloud-dataplex>=1.0.0",
    "matplotlib>=3.8.0",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "google-cloud-aiplatform[agent_engines]>=1.150.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
