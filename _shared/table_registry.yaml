  # --- Gemini Enterprise Agents ---
  data_collection_annotation_ops:
    domain: robot_data_ops
    agent_id: dcao
    location: us-central1
    product_tag: "Gemini Enterprise"
    display_name: "Robot Data Operations: Data Collection & Annotation Ops Intelligence"
    description: "Connects Gemini Enterprise to robot data lakes (Cloud Storage, BigQuery) and labeling pipeline trackers. Enables operations leads and data engineers to monitor collection volume, teleoperation hours, annotation stages, and QA verification velocity via natural language."
    roi_metric: "QA Verification & Data Velocity (+35% verification velocity / $240K quarterly savings)"
    tables:
      - teleop_session_logs
      - annotation_task_pipeline
      - qa_verification_velocity

  multimodal_eval_failure_diagnostics:
    domain: policy_eval_diagnostics
    agent_id: mefd
    location: us-central1
    product_tag: "Gemini Enterprise"
    display_name: "Policy Evaluation: Multimodal Evaluation & Failure Root Cause Analysis"
    description: "Leverages Gemini Enterprise's multimodal retrieval capabilities across evaluation rollout videos, metric tables, and run logs. Helps policy engineers query task success rates, diagnose edge-case failures, and retrieve exact rollout segments showing policy errors."
    roi_metric: "Policy Failure MTTR & Success Uplift (+28% success rate / -45% diagnosis time)"
    tables:
      - eval_rollout_metrics
      - failure_root_causes
      - joint_singularity_events

  synthetic_scene_curation_copilot:
    domain: sim_to_real_synthetic
    agent_id: sscc
    location: us-central1
    product_tag: "Gemini Enterprise"
    display_name: "Sim-to-Real: Synthetic Scene & Edge-Case Curation Copilot"
    description: "Bridges real-world failure logs with 3D simulation asset repositories. Translates natural language descriptions of real-world edge cases into simulation configurations (lighting variations, clutter density, friction parameters) to augment low-data regimes."
    roi_metric: "Synthetic Augmentation & Sim-to-Real Transfer (+60% low-data regime coverage / $380K compute optimization)"
    tables:
      - edge_case_real_trials
      - sim_asset_library
      - domain_randomization_configs

  fleet_diagnostics_hardware_maintenance:
    domain: fleet_telemetry_maintenance
    agent_id: fdhm
    location: us-central1
    product_tag: "Gemini Enterprise"
    display_name: "Fleet Telemetry: Fleet Diagnostics & Hardware Maintenance Assistant"
    description: "Grounds Gemini Enterprise on high-frequency joint telemetry, error logs, and hardware repair SOPs. Enables field technicians and hardware engineers to troubleshoot anomalies, anticipate component fatigue, and obtain step-by-step repair guidance."
    roi_metric: "Fleet Hardware Uptime & MTBF (-40% unplanned hardware downtime / $520K annual maintenance savings)"
    tables:
      - joint_telemetry_streams
      - actuator_maintenance_history
      - force_torque_calibration_logs

  embodied_ai_safety_audit:
    domain: safety_compliance_release
    agent_id: easa
    location: us-central1
    product_tag: "Gemini Enterprise"
    display_name: "Safety & Compliance: Embodied AI Safety Audit & Release Readiness Agent"
    description: "Integrates pre-deployment benchmark evaluations, ISO/OSHA robotic safety standards, and out-of-distribution (OOD) stress tests. Automatically generates safety audit summaries and verifies compliance before weights are flashed to edge hardware."
    roi_metric: "Policy Gate Compliance & Zero Violations (100% ISO/OSHA safety threshold verification)"
    tables:
      - model_safety_benchmarks
      - iso_compliance_evals
      - deployment_gate_checklists


