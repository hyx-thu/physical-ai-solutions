# Source of truth for BigQuery table naming conventions, domain IDs, and agent IDs.
# BigQuery dataset: physical_ai_ent_agents
# Table naming convention: <domain_id>_<agent_id>_<logical_table_stem>
# Both domain_id and agent_id must be exactly 4 lowercase ASCII letters.

